# Public release stack. Application images are pulled from GHCR; contributors
# should keep using docker-compose.yml when they want to build from source.

services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: deepscout
      POSTGRES_PASSWORD: deepscout
      POSTGRES_DB: deepscout
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepscout -d deepscout"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    image: ${DEEPSCOUT_API_IMAGE:-ghcr.io/francescoveryra-dot/deepscout-api:0.1.5}
    env_file:
      - ${DEEPSCOUT_ENV_FILE:-../../.env}
    environment:
      DATABASE_URL: postgresql+psycopg://deepscout:deepscout@postgres:5432/deepscout
      DEEPSCOUT_PROCESS_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  api:
    image: ${DEEPSCOUT_API_IMAGE:-ghcr.io/francescoveryra-dot/deepscout-api:0.1.5}
    env_file:
      - ${DEEPSCOUT_ENV_FILE:-../../.env}
    environment:
      DATABASE_URL: postgresql+psycopg://deepscout:deepscout@postgres:5432/deepscout
      REDIS_URL: redis://redis:6379/0
      APP_ENV: production
      APP_DEBUG: "false"
      API_HOST: 0.0.0.0
      RATE_LIMIT_ENABLED: "true"
      LANGSMITH_TRACING: "false"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "${DEEPSCOUT_API_BIND:-127.0.0.1:8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  worker:
    image: ${DEEPSCOUT_API_IMAGE:-ghcr.io/francescoveryra-dot/deepscout-api:0.1.5}
    env_file:
      - ${DEEPSCOUT_ENV_FILE:-../../.env}
    environment:
      DATABASE_URL: postgresql+psycopg://deepscout:deepscout@postgres:5432/deepscout
      REDIS_URL: redis://redis:6379/0
      DEEPSCOUT_PROCESS_ROLE: worker
      APP_ENV: production
      APP_DEBUG: "false"
      LANGSMITH_TRACING: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  web:
    image: ${DEEPSCOUT_WEB_IMAGE:-ghcr.io/francescoveryra-dot/deepscout-web:0.1.5}
    ports:
      - "${DEEPSCOUT_WEB_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
