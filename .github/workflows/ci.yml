name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required public files
        run: |
          set -euo pipefail
          required=(
            README.md
            ARCHITECTURE.md
            LICENSE
            SECURITY.md
            CONTRIBUTING.md
            CHANGELOG.md
            CODE_OF_CONDUCT.md
            .env.example
            docs/PROJECT_SPEC.md
            docs/threat-model/THREAT_MODEL.md
            docs/DEPLOYMENT.md
            docs/architecture/LANGSMITH_PRIVACY.md
            docs/architecture/HTTP_PRODUCTION_CONTRACT.md
            .semgrep.yml
          )
          for f in "${required[@]}"; do
            test -f "$f" || { echo "Missing required file: $f"; exit 1; }
          done

      - name: Ensure secrets are not tracked
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "BLOCK: .env must not be tracked"
            exit 1
          fi
          tracked_env="$(git ls-files '.env.*' | grep -v '^\.env\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "BLOCK: tracked env files other than .env.example:"
            echo "$tracked_env"
            exit 1
          fi

      - name: Secret and credential scan
        run: bash scripts/scan-secrets.sh

      - name: Verify release version consistency
        run: python scripts/check_release_version.py

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: deepscout
          POSTGRES_PASSWORD: deepscout
          POSTGRES_DB: deepscout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepscout -d deepscout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://deepscout:deepscout@localhost:5432/deepscout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --all-packages --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Apply database migrations
        working-directory: libs/persistence
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest -m "not integration"

      - name: Retrieval regression gate
        run: uv run python scripts/retrieval_regression_gate.py

      - name: Research completeness gate
        run: uv run python scripts/research_completeness_gate.py

      - name: Learning loop gate
        run: uv run python scripts/learning_loop_gate.py
      - name: Learning effectiveness gate
        run: uv run python scripts/learning_effectiveness_gate.py

      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit --progress-spinner off

      - name: Semgrep
        run: uv run --with semgrep semgrep scan --config .semgrep.yml --error --quiet

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install uv for cross-runtime contract tests
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install core contract package
        run: uv sync --package deepscout-core

      - name: Install, audit, test, and build
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium firefox webkit
          npm test
          npm run build
          npm run test:e2e
