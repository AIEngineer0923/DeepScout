name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  validate:
    name: Validate tagged revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
      short_revision: ${{ steps.version.outputs.short_revision }}
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: deepscout
          POSTGRES_PASSWORD: deepscout
          POSTGRES_DB: deepscout
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deepscout -d deepscout"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://deepscout:deepscout@localhost:5432/deepscout
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          set -euo pipefail
          git fetch origin main
          revision="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$revision" origin/main

      - name: Verify version and release notes
        id: version
        run: |
          set -euo pipefail
          python scripts/check_release_version.py --tag "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          revision="$(git rev-parse HEAD)"
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "short_revision=${revision:0:7}"
          } >> "$GITHUB_OUTPUT"

      - name: Protect immutable published releases
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; refusing to move published image tags."
            exit 1
          fi

      - name: Verify main CI and CodeQL passed for this revision
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          for workflow in ci.yml codeql.yml; do
            conclusion="$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$revision&event=push&status=completed&per_page=20" \
              --jq '.workflow_runs | map(select(.head_branch == "main")) | first | .conclusion // "missing"')"
            echo "$workflow: $conclusion"
            test "$conclusion" = "success"
          done

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install Python dependencies
        run: uv sync --all-packages --dev

      - name: Repository, Python, and migration gates
        run: |
          bash scripts/scan-secrets.sh
          uv run ruff check .
          cd libs/persistence
          uv run alembic upgrade head
          cd ../..
          uv run pytest -m "not integration"
          uv run python scripts/retrieval_regression_gate.py
          uv run python scripts/research_completeness_gate.py
          uv run python scripts/learning_loop_gate.py
          uv run python scripts/learning_effectiveness_gate.py

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Frontend gates
        working-directory: apps/web
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

  publish:
    name: Build ${{ matrix.image.name }} (${{ matrix.arch.name }})
    needs: validate
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: api
            image: deepscout-api
            dockerfile: infra/docker/Dockerfile.api
            title: DeepScout API
            description: DeepScout API, research worker, and database migration runtime
          - name: web
            image: deepscout-web
            dockerfile: infra/docker/Dockerfile.web
            title: DeepScout Web
            description: DeepScout Next.js web application for self-hosted deployments
        arch:
          - name: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - name: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and publish native image by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.validate.outputs.version }}
            REVISION=${{ needs.validate.outputs.revision }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.arch.name }}
          provenance: mode=max
          sbom: true

      - name: Export image digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch.name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.name }} manifest
    needs: [validate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            image: deepscout-api
          - name: web
            image: deepscout-web
    steps:
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digests-${{ matrix.name }}-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.version }}
            type=raw,value=sha-${{ needs.validate.outputs.short_revision }}
            type=raw,value=latest

      - name: Create multi-architecture manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "$tag")
          done
          sources=()
          for digest_file in /tmp/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest_file")")
          done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${{ needs.validate.outputs.version }}"
          digest="$(docker buildx imagetools inspect \
            "$IMAGE:${{ needs.validate.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest published manifest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  security-scan:
    name: Scan ${{ matrix.image }} release image
    needs: [validate, merge]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [deepscout-api, deepscout-web]
    steps:
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.validate.outputs.version }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL
          scanners: vuln

  release:
    name: Publish GitHub Release
    needs: [validate, merge, security-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify packages are publicly readable
        run: |
          set -euo pipefail
          docker_config="$(mktemp -d)"
          for package in deepscout-api deepscout-web; do
            image="$REGISTRY/$GITHUB_REPOSITORY_OWNER/$package:${{ needs.validate.outputs.version }}"
            DOCKER_CONFIG="$docker_config" docker manifest inspect "$image" >/dev/null
            echo "$package: public"
          done

      - name: Create or update release
        run: |
          set -euo pipefail
          notes_source="docs/releases/$RELEASE_TAG.md"
          notes="$(mktemp)"
          docs_base="https://github.com/$GITHUB_REPOSITORY/blob/$RELEASE_TAG/docs"
          sed \
            -e "s#](../local-development.md)#]($docs_base/local-development.md)#g" \
            -e "s#](../docker.md)#]($docs_base/docker.md)#g" \
            -e "s#](../DEPLOYMENT.md)#]($docs_base/DEPLOYMENT.md)#g" \
            "$notes_source" > "$notes"
          title="DeepScout $RELEASE_TAG"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$title" --notes-file "$notes" --latest
