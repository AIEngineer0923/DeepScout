[project]
name = "deepscout-evaluation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepscout-core",
    "deepscout-persistence",
    "deepscout-research",
    "langsmith>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscout_evaluation"]

[tool.uv.sources]
deepscout-core = { workspace = true }
deepscout-persistence = { workspace = true }
deepscout-research = { workspace = true }
