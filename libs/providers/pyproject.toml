[project]
name = "deepscout-providers"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepscout-core",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.1",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscout_providers"]

[tool.uv.sources]
deepscout-core = { workspace = true }
