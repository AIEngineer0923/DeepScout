[project]
name = "deepscout-persistence"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepscout-core",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscout_persistence"]

[tool.uv.sources]
deepscout-core = { workspace = true }

[project.scripts]
deepscout-migrate = "deepscout_persistence.cli:main"
