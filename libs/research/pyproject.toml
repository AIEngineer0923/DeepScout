[project]
name = "deepscout-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepscout-core",
    "deepscout-providers",
    "deepscout-persistence",
    "deepscout-evaluation",
    "langchain>=0.3",
    "langgraph>=0.2",
    "langsmith>=0.3",
    "httpx>=0.28",
    "langgraph-checkpoint-postgres>=3.1.2",
    "cryptography>=44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
deepscout-worker = "deepscout_research.jobs.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscout_research"]

[tool.uv.sources]
deepscout-core = { workspace = true }
deepscout-providers = { workspace = true }
deepscout-persistence = { workspace = true }
deepscout-evaluation = { workspace = true }
