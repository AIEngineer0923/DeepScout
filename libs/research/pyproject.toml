[project]
name = "deepscout-research"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "deepscout-core",
    "deepscout-providers",
    "deepscout-persistence",
    "langchain>=0.3",
    "langsmith>=0.3",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepscout_research"]

[tool.uv.sources]
deepscout-core = { workspace = true }
deepscout-providers = { workspace = true }
deepscout-persistence = { workspace = true }
